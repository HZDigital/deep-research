name: Trigger auto deployment for deep-research-mcp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/deep-research-mcp-AutoDeployTrigger-8a4758d3-597f-4dc3-8d86-d7987b3dccd5.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.DEEPRESEARCHMCP_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 4cgroupagcontainerregistry.azurecr.io
          registryUsername: ${{ secrets.DEEPRESEARCHMCP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEEPRESEARCHMCP_REGISTRY_PASSWORD }}
          containerAppName: deep-research-mcp
          resourceGroup: rg-mindscape
          imageToBuild: 4cgroupagcontainerregistry.azurecr.io/deep-research-mcp:${{ github.sha }}
          
            

     

